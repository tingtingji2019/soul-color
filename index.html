<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>灵魂色彩鉴定 - 发现你的灵魂颜色</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ==================== 封面页 ==================== -->
  <div id="cover-page" class="screen active">
    <div class="cover-panel-1">
      <div class="cover-decor">
        <div class="accent-ring ring-1"></div>
        <div class="accent-ring ring-2"></div>
        <div class="accent-ring ring-3"></div>
      </div>
      <div class="cover-content">
        <div class="cover-label">SOUL COLOR TEST</div>
        <h1 class="cover-title">灵魂色彩鉴定</h1>
        <p class="cover-subtitle">你的灵魂，是什么颜色？</p>
        <p class="cover-desc">32道情境选择题，探索你内心最真实的色彩。<br>没有对错，只有最像你的答案。</p>
        <div class="cover-stats">
          <span>32 道题目</span>
          <span>·</span>
          <span>8 种灵魂色彩</span>
          <span>·</span>
          <span>约 8 分钟</span>
        </div>
        <button class="btn-scroll" onclick="scrollToPanel2()">↓ 了解更多</button>
      </div>
    </div>
    <div class="cover-panel-2" id="panel2">
      <div class="panel2-inner">
        <h2 class="panel2-title">八种灵魂色彩</h2>
        <p class="panel2-subtitle">每个人内心都有一种主导色彩，它决定了你感知世界的方式</p>
        <div class="color-grid" id="color-grid"></div>
        <button class="btn-start" onclick="startQuiz()">开 始 鉴 定</button>
      </div>
    </div>
  </div>

  <!-- ==================== 测试页 ==================== -->
  <div id="quiz-page" class="screen">
    <div class="quiz-topbar">
      <span class="brand">灵魂色彩鉴定</span>
      <div class="progress-dots" id="progress-dots"></div>
      <div class="progress-bar-wrap">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <span class="progress-text" id="progress-text">1 / 32</span>
    </div>
    <div class="quiz-body">
      <div class="question-card" id="question-card">
        <div class="q-category" id="q-category"></div>
        <div class="q-badge" id="q-badge">Q01</div>
        <h3 class="q-text" id="q-text"></h3>
        <div class="options-wrap" id="options-wrap"></div>
      </div>
      <button class="btn-prev-q" id="btn-prev-q" onclick="prevQuestion()">← 上一题</button>
    </div>
  </div>

  <!-- ==================== 结果页 ==================== -->
  <div id="result-page" class="screen">
    <div class="result-scroll" id="result-scroll"></div>
  </div>

  <script src="quiz-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
