<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文学灵魂匹配 - 你和哪位作家灵魂相认</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ==================== 封面页 ==================== -->
  <div id="cover-page" class="screen active">
    <div class="cover-panel-1">
      <div class="cover-decor">
        <div class="accent-ring ring-1"></div>
        <div class="accent-ring ring-2"></div>
        <div class="accent-ring ring-3"></div>
      </div>
      <div class="cover-content">
        <div class="cover-label">LITERARY SOUL TEST</div>
        <h1 class="cover-title">文学灵魂匹配</h1>
        <p class="cover-subtitle">你和哪位作家，灵魂相认？</p>
        <p class="cover-desc">32道情境选择题，在16位世界文学巨匠中<br>找到与你灵魂最契合的那一位。</p>
        <div class="cover-stats">
          <span>32 道题目</span>
          <span>·</span>
          <span>16 位作家</span>
          <span>·</span>
          <span>约 8 分钟</span>
        </div>
        <button class="btn-scroll" onclick="scrollToPanel2()">↓ 了解更多</button>
      </div>
    </div>
    <div class="cover-panel-2" id="panel2">
      <div class="panel2-inner">
        <h2 class="panel2-title">十六位文学灵魂</h2>
        <p class="panel2-subtitle">测试将基于你的心理特征、感知方式和情感模式，匹配最契合的文学灵魂</p>
        <div class="writer-grid" id="writer-grid"></div>
        <button class="btn-start" onclick="startQuiz()">开 始 鉴 定</button>
      </div>
    </div>
  </div>

  <!-- ==================== 测试页 ==================== -->
  <div id="quiz-page" class="screen">
    <div class="quiz-topbar">
      <span class="brand">文学灵魂匹配</span>
      <div class="progress-dots" id="progress-dots"></div>
      <div class="progress-bar-wrap">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <span class="progress-text" id="progress-text">1 / 32</span>
    </div>
    <div class="quiz-body">
      <div class="question-card" id="question-card">
        <div class="q-category" id="q-category"></div>
        <div class="q-badge" id="q-badge">Q01</div>
        <h3 class="q-text" id="q-text"></h3>
        <div class="options-wrap" id="options-wrap"></div>
      </div>
      <button class="btn-prev-q" id="btn-prev-q" onclick="prevQuestion()">← 上一题</button>
    </div>
  </div>

  <!-- ==================== 结果页 ==================== -->
  <div id="result-page" class="screen">
    <div class="result-scroll" id="result-scroll"></div>
  </div>

  <script src="quiz-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
